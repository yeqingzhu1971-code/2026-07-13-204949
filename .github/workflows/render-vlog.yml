name: Render BDA high-retention vlog v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository and Git LFS source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install FFmpeg and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Pull and verify the real source video
        shell: bash
        run: |
          git lfs install
          git lfs pull
          VIDEO="2026-07-13 204949.mov"
          test -f "$VIDEO"
          SIZE=$(stat -c%s "$VIDEO")
          echo "Source size: $SIZE bytes"
          test "$SIZE" -gt 1000000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"

      - name: Apply renderer timing and audio graph fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/render_vlog_v2.py')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '"ffmpeg", "-y", "-ss", f"{start:.3f}", "-i", str(src),\n            "-t", f"{duration:.3f}",',
                  '"ffmpeg", "-y", "-ss", f"{start:.3f}", "-t", f"{duration:.3f}", "-i", str(src),'
              ),
              (
                  '"[0:a]highpass=f=70,volume=1.02[voice]",',
                  '"[0:a]highpass=f=70,volume=1.02,asplit=2[voice_mix][voice_sc]",'
              ),
              (
                  '"[bgraw][voice]sidechaincompress=threshold=0.025:ratio=10:attack=12:release=260[bgduck]",',
                  '"[bgraw][voice_sc]sidechaincompress=threshold=0.025:ratio=10:attack=12:release=260[bgduck]",'
              ),
              (
                  'mix_labels = ["[voice]", "[bgduck]"]',
                  'mix_labels = ["[voice_mix]", "[bgduck]"]'
              ),
              (
                  'amix=inputs={len(mix_labels)}:duration=first:dropout_transition=0,alimiter=limit=0.94[aout]',
                  'amix=inputs={len(mix_labels)}:duration=first:dropout_transition=0:normalize=0,volume=1.55,alimiter=limit=0.94[aout]'
              ),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
              elif new not in s:
                  raise SystemExit(f'Expected renderer fragment was not found: {old[:80]}')

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile tools/render_vlog_v2.py

      - name: Render content-aware vlog v2
        shell: bash
        run: |
          set -o pipefail
          python tools/render_vlog_v2.py 2>&1 | tee render_v2.log

      - name: Verify pacing, audio, and outputs
        shell: bash
        run: |
          VIDEO="output_v2/北舞高能量毕业生_嘴闲不住的一天_vlog_v2.mp4"
          test -s "$VIDEO"
          python - <<'PY'
          import json, re, subprocess
          p='output_v2/北舞高能量毕业生_嘴闲不住的一天_vlog_v2.mp4'
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',p],text=True))
          plan=json.load(open('tools/vlog_v2_plan.json',encoding='utf-8'))
          assert 110 <= d <= 122, d
          assert len(plan['clips']) >= 65

          probe=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries',
              'stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels',
              '-show_entries','format=duration,size','-of','json',p
          ],text=True))
          video=next(s for s in probe['streams'] if s['codec_type']=='video')
          audio=next(s for s in probe['streams'] if s['codec_type']=='audio')
          assert video['width']==720 and video['height']==1280
          assert audio['channels']==2

          loud=subprocess.run([
              'ffmpeg','-hide_banner','-i',p,'-vn','-af',
              'loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json',
              '-f','null','-'
          ],text=True,capture_output=True,check=True)
          match=re.search(r'"input_i"\s*:\s*"(-?[0-9.]+)"',loud.stderr)
          assert match, loud.stderr[-2000:]
          integrated=float(match.group(1))
          assert -19.5 <= integrated <= -12.0, integrated
          print({
              'duration': d,
              'clips': len(plan['clips']),
              'average_shot_length': d/len(plan['clips']),
              'integrated_loudness_lufs': integrated,
              'resolution': f"{video['width']}x{video['height']}"
          })
          PY
          ls -lh output_v2

      - name: Upload revised vlog, subtitles, and edit plan
        uses: actions/upload-artifact@v4
        with:
          name: bda-high-energy-graduate-vlog-v2
          path: output_v2/*
          compression-level: 0
          retention-days: 14

      - name: Upload render diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bda-vlog-v2-render-diagnostics
          path: |
            render_v2.log
            .vlog_v2_work/concat.txt
            .vlog_v2_work/vlog_v2.ass
            output_v2/*
          if-no-files-found: ignore
          retention-days: 3
