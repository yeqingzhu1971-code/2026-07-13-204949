name: Render energetic BDA vlog

on:
  push:
    branches: [vlog-edit]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository and LFS video
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install FFmpeg, fonts, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install openai-whisper

      - name: Render vlog
        run: python tools/render_vlog.py

      - name: List outputs
        run: |
          ls -lh output
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "output/北舞高能量毕业生_嘴闲不住的一天_vlog.mp4"

      - name: Upload final vlog and subtitles
        uses: actions/upload-artifact@v4
        with:
          name: bda-high-energy-graduate-vlog
          path: output/*
          compression-level: 0
          retention-days: 14
