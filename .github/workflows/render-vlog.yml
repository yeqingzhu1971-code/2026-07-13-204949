name: Analyze BDA vlog source

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository and Git LFS source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install FFmpeg, Chinese fonts, and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Pull and verify the real source video
        shell: bash
        run: |
          git lfs install
          git lfs pull
          VIDEO="2026-07-13 204949.mov"
          test -f "$VIDEO"
          SIZE=$(stat -c%s "$VIDEO")
          echo "Source size: $SIZE bytes"
          test "$SIZE" -gt 1000000000
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"

      - name: Build scene index, timecoded proxy, and full dialogue transcript
        run: python tools/analyze_source.py

      - name: Verify analysis outputs
        run: |
          find source_analysis -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -s source_analysis/source_proxy_timecode.mp4
          test -s source_analysis/full_source_transcript.json

      - name: Upload source analysis
        uses: actions/upload-artifact@v4
        with:
          name: bda-vlog-source-analysis
          path: source_analysis/*
          compression-level: 0
          retention-days: 5
